<!doctype html>
<html lang="{{meta.lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>{{notfound.title}}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="hero notfound">
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1>{{notfound.heading}}</h1>
      <p class="lead">{{notfound.body}}</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">{{notfound.cta}}</a>
      </div>
    </div>
  </main>
</body>
</html>
